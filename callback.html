<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexión con TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1b1b2f;background:#fff}h1{color:#ff5a36}code{display:block;word-break:break-all;background:#f3f3f7;padding:12px;border-radius:8px;font-size:15px}button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#ff5a36;color:#fff;font-size:16px}</style></head>
<body><h1>Así Funciona Publicador</h1><div id="r"></div>
<script>
const p=new URLSearchParams(location.search),r=document.getElementById('r');
if(p.get('code')){r.innerHTML='<p>✅ Autorización recibida. Copia este código de un solo uso y pégalo en el hilo del proyecto (vence en pocos minutos):</p><code id="c"></code><button id="b">Copiar</button>';
document.getElementById('c').textContent=p.get('code');
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(p.get('code'));document.getElementById('b').textContent='Copiado';};}
else if(p.get('error')){r.textContent='❌ No se autorizó: '+p.get('error')+' '+(p.get('error_description')||'');}
else{r.innerHTML='<p>Esta página recibe la autorización de TikTok para la herramienta interna del canal. <a href="./">Volver</a></p>';}
</script></body></html>
